[install]
linker = "hoisted"

[run]
bun = true

[test]
# Per file: 100% of lines and functions for every file a test imports. check.ts is excluded because its runner is exercised by
# `bun run check` in the pre-commit hook and CI; its logic (hasRelativeImport) is still unit-tested.
coverageThreshold = 1.0
coveragePathIgnorePatterns = ["check.ts"]
